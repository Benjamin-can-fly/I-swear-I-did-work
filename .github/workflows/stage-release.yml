name: Stage verified installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.3
      windows_run:
        description: Successful Windows build run ID
        required: true
      macos_run:
        description: Successful macOS build run ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          run-id: ${{ inputs.windows_run }}
          github-token: ${{ github.token }}
          path: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-installer
          run-id: ${{ inputs.macos_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packages
      - name: Verify and attach to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          cd packages
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          test -f WorkLog-${VERSION}-windows-x64-setup.exe
          test -f WorkLog-${VERSION}-macos-arm64.dmg
          test -f WorkLog-${VERSION}-macos-x64.dmg
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" ./* --clobber
